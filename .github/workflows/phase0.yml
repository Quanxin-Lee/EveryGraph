name: Phase 0 toolchain and planning

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: ${{ matrix.preset }}
    runs-on: macos-14-xlarge
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        preset: [macos-debug, macos-release, macos-sanitize]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
          architecture: arm64
      - name: Check architecture and compiler
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          sw_vers
          xcode-select -p
          xcrun clang++ --version
          xcrun --show-sdk-version
      - name: Install pinned build tools
        run: python -m pip install cmake==3.31.6 ninja==1.11.1.4
      - name: Check build tool versions
        run: |
          python --version
          python -m pip show cmake ninja
          cmake --version
          ninja --version
      - name: Configure, build, and run probe and planning validation
        shell: bash
        run: |
          set -euo pipefail
          cmake --preset "${{ matrix.preset }}"
          cmake --build --preset "${{ matrix.preset }}"
          ctest --preset "${{ matrix.preset }}"

  windows:
    name: ${{ matrix.preset }}
    runs-on: windows-2022
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        preset: [windows-debug, windows-release]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
          architecture: x64
      - name: Install pinned build tools
        run: python -m pip install cmake==3.31.6 ninja==1.11.1.4
      - name: Check build tool versions
        run: |
          python --version
          python -m pip show cmake ninja
          cmake --version
          ninja --version
      - name: Initialize VS 2022 x64, build, and run probe and planning validation
        shell: cmd
        run: |
          set "VSINSTALLDIR="
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -version "[17.0,18.0)" -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALLDIR=%%i"
          if not defined VSINSTALLDIR exit /b 1
          call "%VSINSTALLDIR%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
          if errorlevel 1 exit /b 1
          if not "%VSCMD_ARG_TGT_ARCH%"=="x64" exit /b 1
          where cl || exit /b 1
          cmake --preset "${{ matrix.preset }}" || exit /b 1
          cmake --build --preset "${{ matrix.preset }}" || exit /b 1
          ctest --preset "${{ matrix.preset }}" || exit /b 1
